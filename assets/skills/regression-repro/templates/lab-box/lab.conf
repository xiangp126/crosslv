# lab.conf - one task on one reg box: everything env_rebuild.sh and per_run.sh need to know.
#
# Template: skill regression-repro, templates/lab-box/ (procedure.md Phase 9b).
# Copy lab.conf, env_rebuild.sh and per_run.sh into <task dir>/tools/ and fill in this file.
# Change the two scripts only when no hook below can express what the task needs, and say why in
# the task's TRACKING.md. A second box or a control group is a second conf file that sources this
# one and overrides a few values (end of this file); both scripts take it with --lab <file>.
#
# Plain bash, sourced by both scripts: settings and function definitions only, no side effects.

# Set to "<date> <log>" once a run with this conf produced the outcome it was written for.
# Until then both scripts print an UNVERIFIED banner.
VERIFIED=

# ------------------------------------------------------------------ box and card
HOST=l-fwreg-NNN                  # the reg box; per_run refuses to run anywhere else
DEV=/dev/mst/mtNNNN_pciconf0      # mst device of the card under test
DPU=0                             # 1 = BlueField/DPU: make a new image live with fw-reset; power-cycle
                                  #     only when mlxfwreset says a cold boot is needed
# PCI class codes of the 15b3 functions in BDF order, read off a known-good environment:
#   lspci -D -n -d 15b3: | sort | awk '{print $2}' | tr -d : | xargs
# 0200 Ethernet, 0207 InfiniBand, 0801 DMA controller (a PSF). Gated after every rebuild and before
# every run.
WANT_CLASSES="0200 0200"

# ------------------------------------------------------------------ image (env_rebuild --burn)
FW_MLX=/path/to/fw-Chip.mlx       # must be readable from the box (an NFS path)
FW_INI=/path/to/board.ini         # the INI of the card on HOST (its psid = `flint -d $DEV q` PSID), or
                                  # the regression-generated one; never another box's default
INI_REQUIRE=                      # optional regex FW_INI must match, e.g. a feature's INI gate
EXPECT_FW=NN.NN.NNNN              # the image's version: checked before burning, after the rebuild
                                  # and before every run

# ------------------------------------------------------------------ NV
# The NV of the known-good environment. env_rebuild --burn runs `mlxconfig reset`, then one
# `mlxconfig set` per group (at most 4 parameters each) and reads Next Boot back after each; the
# Current values are gated after the rebuild and before every run. A factory reset alone is not the
# known-good state. On a box in a MARS rotation, use that setup's own recipe:
#   tar -xzOf /auto/sw_regression/host_fw/HCA_CORE_FWV/MARS/conf/results/<setup>/<sid>/<sid>.tgz \
#       | grep -a 'running cmd: sudo mlxconfig'
NV_RECIPE=(
    "LINK_TYPE_P1=2 LINK_TYPE_P2=2"
)

# ------------------------------------------------------------------ the tool (per_run)
TASK_DIR=/auto/fwgwork1/$USER/bugZilla/TASK       # TRACKING.md; env_rebuild logs go to its logs/
UTOPX=/auto/fwgwork1/$USER/utopx-TASK/utopx.exe   # per_run -U overrides
LOGDIR=                           # empty = $(dirname $UTOPX)/logs: the tree under test keeps its own
                                  # evidence. Set it when the binary sits somewhere temporary
                                  # (/tmp/mars_tests/... is wiped by the regression).
RUN_NAME=TASK                     # prefix of every per_run file
SEED=1
ITER=50
OPS=40
CONF_FILE=config/cmdif_test.conf  # relative to the utopx tree; per_run --conf_file overrides
XML_CONF=conf.xml                 # debug_conf.xml only while chasing a root cause (it is slow)
UTOPX_TIMEOUT=                    # utopx --timeout in seconds; empty = none
# Extra utopx arguments for every run. pre_test_nvconfig_set_en=0 keeps utopx from rewriting NV
# before the run, which would fail the next run's NV gate. Drop it in a repro whose regression
# command does not carry it.
UTOPX_ARGS=(-e test_mode.pre_test_nvconfig_set_en=0)

# ------------------------------------------------------------------ the verdict
# What exit 0 means:  feature   - the new path ran and the run passed
#                     repro     - the defect signature appeared
#                     fixverify - the defect's trigger was present, its signature was not, run passed
MODE=feature
FEATURE_GATE=                     # feature: the utopx key that opens the new path; per_run passes
                                  # -e KEY=1, and with --feature-off KEY=0
CONTROL=0                         # 1 = a control group: the new path must stay dark
FIX_COMMIT=                       # repro: refuse a tool tree that contains it; fixverify: require it

# Print how many log lines prove the run is about this task.
#   feature            : lines only the new code emits (a new op_mod, a new capability field), never
#                        the feature's name - the name shows up in the config dump of every run
#   repro / fixverify  : the defect's own signature, verbatim
count_signal() { grep -acE 'REPLACE WITH THE SIGNAL' "$1" || true; }

# fixverify only: succeed when the defect's trigger was present in this run. Without it, a clean
# run may never have reached the code the fix changed; the default answers no.
# preconditions_met() { grep -aq '<the trigger line>' "$1"; }

# ------------------------------------------------------------------ hooks (defaults in the scripts)
# reset_device LOG   per_run, before and after every run. Default: jmake --fw-reset --device $DEV,
#                    then bind_udriver (binds driverless 15b3 functions, fails on any held by
#                    another driver). Known replacements:
#   CX8 exposing a PSF (15b3:1028) - the PSF-aware reset (skill fw-build-burn-utopx section 5):
#     reset_device() { sudo /swgwork/topazu/dev/hca_fw_tools/fw_reset/fwreset.py --debug -d "$DEV" >"$1" 2>&1 && bind_udriver; }
#   A repro that mirrors the regression's own per-case reset:
#     reset_device() { sudo -E python -u /mswg/projects/fw/fw_ver/regression/HcaCoreRegression/RegTools/Fwreset.py \
#         --session_id=<private id> --next_udriver --topo=<topology.xml> --entry_points='<ep> <ep>' >"$1" 2>&1; }
# run_tool LOG       per_run; default: utopx with the settings above, output to LOG. Replace it to
#                    replay a regression command verbatim (--session_id, --case_name ...).
# before_run         per_run, just before run_tool; default: nothing. Known replacement:
#   a DPU / ARM-agent suite checks the ARM agent before every attempt, as the regression does:
#     before_run() { sudo -E /auto/sw_tools/OpenSource/python/INSTALLS/python_3.7.5/linux_x86_64/bin/python3 \
#         /mswg/projects/fw/fw_ver/regression/HcaCoreRegression/RegTools/check_arm_agent.py \
#         --topo=<topology.xml> --entry_points='<ep> <ep>' || die "ARM agent check failed"; }
# report_task LOG    per_run, under the verdict factors; default: nothing. Print task evidence.
# nv_restore         env_rebuild --burn; default: mlxconfig reset + NV_RECIPE with read-back. A repro
#                    may mirror the regression's own clear_nv_data.py + SetMlxConfig.py instead.
# make_live          env_rebuild --burn and --cycle; default: power-cycle (DPU: fw-reset unless a cold
#                    boot is due).
# setup_box          env_rebuild, every mode, after the checks that may refuse and before any rebuild
#                    step; default: print the udriver build. Install what the task needs and MARS does
#                    not leave behind; keep it idempotent, it runs on every rebuild. A kernel module it
#                    installs is not loaded until make_live: WILL_CYCLE is 1 when this run calls it
#                    (--burn, --cycle); otherwise fail if the loaded module is not the installed one.
#   The official udriver, the one utopx is built against (`UDRIVER_VERSION` in the tree's build.sh):
#   `install_udriver` (.fwvalias function install_udriver_func) clones hca_fw/udriver master on the
#   host it runs on and runs its install.sh - library, headers and .ko, nothing loaded. Run it ON THE
#   BOX, through SSH with .fwvalias sourced, then compare /bin/udriver_commit_hash with the pin.

# ------------------------------------------------------------------ a control group or a second box
# lab_control.conf next to this file:
#   source "$(dirname "${BASH_SOURCE[0]}")/lab.conf"
#   FW_INI=/mswg/release/BUILDS/.../dist/<board>.ini     # without the feature's INI gate
#   INI_REQUIRE=
#   WANT_CLASSES="0200 0200"
#   CONTROL=1
